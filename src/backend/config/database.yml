default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: db/development.sqlite3

test:
  <<: *default
  database: db/test.sqlite3

production:
  <<: *default
  # db/ 配下は migrate/ 等アプリケーションコードも置く場所であり、ここに
  # 永続化ボリュームをマウントするとイメージ内のマイグレーションファイルが
  # 隠れて db:prepare が「テーブル無し」のまま起動してしまう
  # （本番デプロイ時に実際に踏んだ）。データファイルのみを持つ storage/ を使う。
  database: storage/production.sqlite3
